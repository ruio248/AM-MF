[project]
name = "am-mf"
version = "0.1.0"
description = "MeanFlowQL with native MeanFlow, AM-MF, and consistency evaluation"
readme = "README.md"
requires-python = "==3.9.21"
dependencies = [
    "absl-py==2.2.2",
    "chex==0.1.89",
    "distrax==0.1.5",
    "dm-control==1.0.30",
    "flax==0.8.5",
    "gymnasium==0.29.1",
    "h5py==3.13.0",
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "ml-collections==0.1.1",
    "mujoco==3.3.2",
    "numpy==1.26.4",
    "ogbench==1.1.0",
    "optax==0.2.4",
    "orbax-checkpoint==0.6.4",
    "pillow==10.4.0",
    "scipy==1.13.1",
    "tqdm==4.67.1",
    "wandb==0.19.11",
]

[project.optional-dependencies]
# Reproduces the JAX 0.4.30 CUDA 12 stack from environment.yml. The marker
# prevents uv from trying to install NVIDIA-only wheels on macOS/Windows.
cuda12 = [
    "jax-cuda12-pjrt==0.4.30; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax-cuda12-plugin[with-cuda]==0.4.30; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# D4RL 1.1 is not published as a normal PyPI release. Pinning the repository
# commit makes `uv sync --frozen --extra d4rl` reproducible.
d4rl = [
    "d4rl @ git+https://github.com/Farama-Foundation/D4RL.git@89141a689b0353b0dac3da5cba60da4b1b16254d",
    "gym==0.23.1",
    "mujoco-py==2.1.2.14",
]

toy = [
    "matplotlib==3.9.4",
    "pot>=0.9.5,<0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
